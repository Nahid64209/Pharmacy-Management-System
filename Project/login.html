<!DOCTYPE html>
<html>
<head>
     <meta charset="UTF-8">
    <title>Login | Pharmacy Management System</title>

    <link rel="stylesheet" href="css/login.css">
</head>

<body>

<div class="container">

    <div class="left">

        <h1>Welcome Back!</h1>

        <p>
            Login to manage medicines, inventory,
            suppliers, sales and reports.
        </p>

    </div>


    <div class="right">

        <form action="dashboard.html" method="POST">

            <h2>Login</h2>

            <div class="input-box">

                <span>👤</span>

                <input type="text"
                       name="username"
                       placeholder="Username"
                       required>

            </div>


            <div class="input-box">

                <span>🔒</span>

                <input type="password"
                       name="password"
                       placeholder="Password"
                       required>

            </div>


            <button type="submit">
                Login
            </button>


            <p>
                Don't have an account?

                <a href="signup.html">
                    Sign Up
                </a>
            </p>

        </form>

    </div>

</div>

</body>
</html>
