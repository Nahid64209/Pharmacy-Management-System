<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sign Up</title>

    <link rel="stylesheet" href="css/signup.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="container">

    <div class="left">

        <h1>Create Account</h1>

        <p>
            Join Pharmacy Management System
            to manage your pharmacy easily.
        </p>

    </div>

    <div class="right">

        <form action="" method="POST">

            <h2>Sign Up</h2>

            <div class="input-box">

                <i class="fa fa-user"></i>

                <input
                    type="text"
                    name="fullname"
                    placeholder="Full Name"
                    required>

            </div>

            <div class="input-box">

                <i class="fa fa-envelope"></i>

                <input
                    type="email"
                    name="email"
                    placeholder="Email"
                    required>

            </div>

            <div class="input-box">

                <i class="fa fa-user"></i>

                <input
                    type="text"
                    name="username"
                    placeholder="Username"
                    required>

            </div>

            <div class="input-box">

                <i class="fa fa-lock"></i>

                <input
                    type="password"
                    name="password"
                    placeholder="Password"
                    required>

            </div>

            <div class="input-box">

                <i class="fa fa-lock"></i>

                <input
                    type="password"
                    name="confirm"
                    placeholder="Confirm Password"
                    required>

            </div>

            <button type="submit">
                Create Account
            </button>

            <p>
                Already have an account?

                <a href="login.html">
                    Login
                </a>
            </p>

        </form>

    </div>

</div>

</body>
</html>
